name: PCFrameViewer
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: org.example.PCFrameViewer
targets:
  PCFrameViewer:
    type: application
    platform: iOS
    sources:
      - path: ViewerApp.swift
      - path: CameraModel.swift
      - path: ../virtual-camera-core
      - path: ../camera-hook
      - path: ../ios-receiver
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PC Frame Viewer
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Receive test image frames from your Windows PC over your local network.
        NSCameraUsageDescription: Test physical camera callbacks and PC frame substitution in this app.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Bridge.h
        HEADER_SEARCH_PATHS: '$(SRCROOT)/../virtual-camera-core'
        CLANG_ENABLE_OBJC_ARC: YES
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
schemes:
  PCFrameViewer:
    build:
      targets:
        PCFrameViewer: all
